<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Ration Card Finder</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; color: #333; }
        label { font-weight: bold; margin-top: 10px; display: block; }
        input { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #28a745; color: white; border: none; padding: 10px; font-size: 16px; border-radius: 4px; cursor: pointer; }
        button:disabled { background: #6c757d; }
        #log-box { margin-top: 20px; padding: 10px; background: #e9ecef; border-radius: 4px; height: 200px; overflow-y: auto; font-size: 14px; }
        .success { color: green; font-weight: bold; font-size: 18px; margin-top: 15px; }
        .link { display: block; margin-top: 10px; color: blue; text-decoration: underline; word-break: break-all; }
    </style>
</head>
<body>

<div class="container">
    <h2>राशन कार्ड सीरियल फाइंडर</h2>
    
    <label>एप्लीकेशन ID (App ID):</label>
    <input type="text" id="appId" value="0919000960190621">

    <label>राशन कार्ड नंबर:</label>
    <input type="text" id="rcNum" value="219040822667">

    <label>कहाँ तक चेक करना है? (Max):</label>
    <input type="number" id="maxLimit" value="1500">

    <button id="startBtn" onclick="startSearch()">खोजना शुरू करें</button>

    <div id="log-box">सिस्टम तैयार है...<br></div>
    <div id="result"></div>
</div>

<script>
    let isRunning = false;

    async function startSearch() {
        let appId = document.getElementById("appId").value;
        let rcNum = document.getElementById("rcNum").value;
        let maxLimit = parseInt(document.getElementById("maxLimit").value);
        let logBox = document.getElementById("log-box");
        let resultBox = document.getElementById("result");
        let btn = document.getElementById("startBtn");

        if(!appId || !rcNum) {
            alert("कृपया सभी जानकारी भरें!");
            return;
        }

        isRunning = true;
        btn.disabled = true;
        btn.innerText = "खोज चल रही है...";
        logBox.innerHTML = "खोज शुरू हो गई है... कृपया ब्राउज़र बंद न करें।<br><br>";
        resultBox.innerHTML = "";

        const baseUrl = "https://nfsa.up.gov.in/Food/TrackingRationCard/ViewRC.aspx?Details=";

        for (let i = 1; i <= maxLimit; i++) {
            if (!isRunning) break;

            let fpsCode = String(i).padStart(8, '0'); // जैसे 00000001
            let rawText = `${appId}#${fpsCode}#${rcNum}`;
            
            // Base64 & URL Encoding
            let b64 = btoa(rawText);
            let encodedDetails = encodeURIComponent(b64);
            let fullUrl = baseUrl + encodedDetails;

            // CORS Bypass Proxy (AllOrigins)
            let proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(fullUrl)}`;

            logBox.innerHTML = `सीरियल नंबर <b>${i}</b> चेक हो रहा है...<br>` + logBox.innerHTML;

            try {
                let response = await fetch(proxyUrl);
                let data = await response.json();

                // चेक करना कि पेज में राशन कार्ड नंबर है या नहीं
                if (data.contents && data.contents.includes(rcNum)) {
                    logBox.innerHTML = `<b>✅ सफलता!</b><br>` + logBox.innerHTML;
                    resultBox.innerHTML = `
                        <div class="success">✅ मैच मिल गया! कोटेदार कोड: ${i}</div>
                        <a class="link" href="${fullUrl}" target="_blank">यहाँ क्लिक करके अपना राशन कार्ड खोलें</a>
                    `;
                    isRunning = false;
                    break;
                }
            } catch (error) {
                logBox.innerHTML = `सीरियल ${i} पर नेटवर्क एरर...<br>` + logBox.innerHTML;
            }

            // IP ब्लॉक होने से बचाने के लिए 1 सेकंड का गैप
            await new Promise(resolve => setTimeout(resolve, 1000));
        }

        btn.disabled = false;
        btn.innerText = "खोजना शुरू करें";
    }
</script>

</body>
</html>
