<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Generator Tool</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; color: #0056b3; }
        label { font-weight: bold; margin-top: 10px; display: block; }
        input { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #0056b3; color: white; border: none; padding: 10px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .link-box { margin-top: 20px; padding: 10px; background: #e9ecef; border-radius: 4px; height: 400px; overflow-y: auto; }
        .link-item { background: white; padding: 10px; border: 1px solid #ccc; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        a { color: #d9534f; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔗 राशन कार्ड डायरेक्ट लिंक जनरेटर</h2>
    
    <label>एप्लीकेशन ID (App ID):</label>
    <input type="text" id="appId" value="0919000960190621">

    <label>राशन कार्ड नंबर:</label>
    <input type="text" id="rcNum" value="219040822667">

    <label>शुरुआती नंबर (Start):</label>
    <input type="number" id="startLimit" value="1">

    <label>कहाँ तक लिंक बनाने हैं? (End):</label>
    <input type="number" id="endLimit" value="1500">

    <button onclick="generateLinks()">सारे लिंक एक साथ जनरेट करें</button>

    <div class="link-box" id="result-box">
        लिंक्स यहाँ दिखाई देंगे...
    </div>
</div>

<script>
    function generateLinks() {
        let appId = document.getElementById("appId").value;
        let rcNum = document.getElementById("rcNum").value;
        let startLimit = parseInt(document.getElementById("startLimit").value);
        let endLimit = parseInt(document.getElementById("endLimit").value);
        let resultBox = document.getElementById("result-box");

        if(!appId || !rcNum) {
            alert("कृपया सभी जानकारी भरें!");
            return;
        }

        resultBox.innerHTML = "<span style='color:green;'>लिंक्स बन रहे हैं...</span>";
        let htmlContent = "";
        
        const baseUrl = "https://nfsa.up.gov.in/Food/TrackingRationCard/ViewRC.aspx?Details=";

        for (let i = startLimit; i <= endLimit; i++) {
            // यही वो लाइन है जो 232 को 00000232 बनाती है (8 अंकों का फॉर्मेट)
            let fpsCode = String(i).padStart(8, '0'); 
            
            let rawText = `${appId}#${fpsCode}#${rcNum}`;
            
            // Base64 + URL Encode (जैसे आपने ऊपर बताया बिल्कुल वही फॉर्मेट)
            let b64 = btoa(rawText);
            let encodedDetails = encodeURIComponent(b64);
            let fullUrl = baseUrl + encodedDetails;

            htmlContent += `
                <div class="link-item">
                    <span>सीरियल नंबर: <b>${fpsCode}</b></span>
                    <a href="${fullUrl}" target="_blank">यहाँ क्लिक करके चेक करें ➔</a>
                </div>
            `;
        }

        resultBox.innerHTML = htmlContent;
    }
</script>

</body>
</html>
